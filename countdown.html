<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something is Coming — HAFYZ</title>
  <meta name="description" content="Something special is coming from HAFYZ. Stay tuned.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://hafyz.my.id/countdown.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hafyz.my.id/countdown.html">
  <meta property="og:title" content="Something is Coming — HAFYZ">
  <meta property="og:description" content="Something special is coming. Stay tuned.">
  <meta property="og:image" content="https://hafyz.my.id/og-image.jpg">
  <meta property="og:site_name" content="HAFYZ">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Something is Coming — HAFYZ">
  <meta name="twitter:description" content="Something special is coming. Stay tuned.">
  <meta name="twitter:image" content="https://hafyz.my.id/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f5f5;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-tertiary: #888888;
      --accent: #c9a84c;
      --accent-hover: #d4b55a;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      overflow-x: hidden;
    }

    /* Logo */
    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 60px;
      transition: opacity 0.3s;
    }
    .logo:hover { opacity: 0.7; }

    /* Teaser */
    .teaser {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.2s forwards;
    }

    /* Mystery text */
    .mystery {
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.4s forwards;
    }
    .mystery span {
      background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.6s forwards;
    }

    /* Countdown */
    .countdown {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.8s forwards;
    }

    .countdown-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      min-width: 90px;
    }

    .countdown-number {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--text);
      display: block;
      margin-bottom: 8px;
    }

    .countdown-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-tertiary);
    }

    /* Release date */
    .release-date {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 1s forwards;
    }
    .release-date strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Notify button */
    .notify-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: 980px;
      background: var(--accent);
      color: var(--bg);
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s var(--transition);
      opacity: 0;
      animation: fadeUp 1s var(--transition) 1.2s forwards;
    }
    .notify-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .countdown { gap: 10px; }
      .countdown-item { padding: 18px 14px; min-width: 70px; }
      .countdown-number { font-size: 32px; }
      .countdown-label { font-size: 10px; }
      .mystery { font-size: 32px; }
    }
  </style>
</head>
<body>
  <a href="/" class="logo">HAFYZ</a>

  <div class="teaser">Something is Coming</div>
  <h1 class="mystery"><span>08.14.2026</span></h1>
  <p class="subtitle">A new chapter begins.</p>

  <div class="countdown" id="countdown">
    <div class="countdown-item">
      <span class="countdown-number" id="days">00</span>
      <span class="countdown-label">Days</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="hours">00</span>
      <span class="countdown-label">Hours</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="minutes">00</span>
      <span class="countdown-label">Minutes</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="seconds">00</span>
      <span class="countdown-label">Seconds</span>
    </div>
  </div>

  <p class="release-date">Releasing <strong>August 14, 2026 at 11:00 WIB</strong></p>

  <a href="/#contact" class="notify-btn">Get Notified →</a>

  <div class="footer">© 2026 HAFYZ</div>

  <script>
    // Target: August 14, 2026 at 11:00 WIB (04:00 UTC)
    const targetDate = new Date('2026-08-14T04:00:00Z');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        // Time's up! Redirect to release page
        window.location.href = '/new-release.html';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
