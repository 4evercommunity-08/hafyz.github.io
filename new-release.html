  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f5f5;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --text-tertiary: #888888;
      --accent: #c9a84c;
      --accent-hover: #d4b55a;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      overflow-x: hidden;
    }

    /* Logo */
    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 60px;
      transition: opacity 0.3s;
    }
    .logo:hover { opacity: 0.7; }

    /* Out Now badge */
    .badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 100px;
      background: var(--accent);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.2s forwards;
    }

    /* Title - placeholder, will be revealed */
    .title {
      font-size: clamp(32px, 7vw, 64px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.4s forwards;
    }
    .title span {
      background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.6s forwards;
    }

    /* Cover art placeholder */
    .cover-art {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
      border-radius: 24px;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 0.8s forwards;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    /* Listen buttons */
    .listen-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 1s forwards;
    }

    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 980px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s var(--transition);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-elevated);
    }

    /* Back link */
    .back-link {
      font-size: 14px;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.3s;
      opacity: 0;
      animation: fadeUp 1s var(--transition) 1.2s forwards;
    }
    .back-link:hover {
      color: var(--text);
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .cover-art { width: 240px; height: 240px; }
      .listen-buttons { flex-direction: column; align-items: center; }
      .listen-btn { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>
