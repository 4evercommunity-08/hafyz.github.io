<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official press kit for HAFYZ — bio, metrics, releases, press coverage, technical rider and booking information.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Press Kit | HAFYZ">
  <meta property="og:description" content="Official press kit for HAFYZ — bio, metrics, releases, press coverage and booking information.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hafyz.my.id/press/">
  <meta property="og:image" content="https://hafyz.my.id/hero-bg.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:site_name" content="HAFYZ">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Press Kit | HAFYZ">
  <meta name="twitter:description" content="Official press kit for HAFYZ — bio, metrics, releases, press coverage and booking information.">
  <meta name="twitter:image" content="https://hafyz.my.id/hero-bg.jpg">
  <link rel="canonical" href="https://hafyz.my.id/press/">

  <title>HAFYZ — Press Kit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f7f7f4;
      --bg-soft:#171717;
      --surface:#ffffff;
      --surface-2:#f1f1ee;
      --line:rgba(20,20,20,.10);
      --line-strong:rgba(20,20,20,.18);
      --text:#171717;
      --muted:#777772;
      --muted-2:#8a8a85;
      --gold:#d8b65b;
      --gold-soft:#efd88a;
      --max:1120px;
      --radius:26px;
      --ease:cubic-bezier(.2,.75,.25,1);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{
      background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    body.menu-open{overflow:hidden}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    button,input{font:inherit}
    ::selection{background:var(--gold);color:#111111}
    :focus-visible{outline:2px solid var(--gold);outline-offset:4px}

    .container{width:min(calc(100% - 40px),var(--max));margin:auto}

    /* NAV */
    .nav{
      position:fixed;inset:0 0 auto;height:72px;z-index:1000;
      border-bottom:1px solid transparent;transition:.35s var(--ease);
    }
    .nav.scrolled{
      background:rgba(7,7,7,.82);border-color:var(--line);
      backdrop-filter:blur(22px) saturate(150%);
      -webkit-backdrop-filter:blur(22px) saturate(150%);
    }
    .nav-inner{
      width:min(calc(100% - 40px),var(--max));height:100%;margin:auto;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{
      font-family:"Space Grotesk",sans-serif;font-weight:700;
      letter-spacing:.25em;font-size:18px;
    }
    .brand:hover{color:var(--gold)}
    .nav-links{display:flex;align-items:center;gap:27px;list-style:none}
    .nav-links a{
      color:#555551;font-size:12px;font-weight:500;position:relative;transition:.25s;
    }
    .nav-links a:hover{color:#fff}
    .nav-links a::after{
      content:"";position:absolute;left:0;right:100%;bottom:-7px;height:1px;
      background:var(--gold);transition:.3s var(--ease);
    }
    .nav-links a:hover::after{right:0}
    .home-link{padding:9px 15px;border:1px solid var(--line-strong);border-radius:999px}
    .home-link::after{display:none!important}
    .home-link:hover{border-color:var(--gold);color:var(--gold)!important}
    .menu{
      display:none;width:42px;height:42px;border-radius:50%;
      border:1px solid var(--line);background:#ffffff;cursor:pointer;
    }
    .menu span,.menu span:before,.menu span:after{
      content:"";display:block;width:17px;height:1.5px;background:#fff;
      margin:auto;position:relative;transition:.25s;
    }
    .menu span:before,.menu span:after{position:absolute;left:0}
    .menu span:before{top:-6px}.menu span:after{top:6px}
    .menu.active span{background:transparent}
    .menu.active span:before{top:0;transform:rotate(45deg)}
    .menu.active span:after{top:0;transform:rotate(-45deg)}

    /* HERO */
    .hero{
      min-height:88svh;position:relative;display:flex;align-items:end;
      isolation:isolate;overflow:hidden;
      background:#090909 url("/hero-bg.jpg") center/cover no-repeat;
    }
    .hero:before{
      content:"";position:absolute;inset:0;z-index:-2;
      background:
        linear-gradient(180deg,rgba(255,255,255,.50),rgba(255,255,255,.42) 40%,#f7f7f4 100%),
        linear-gradient(90deg,rgba(0,0,0,.55),transparent 55%,rgba(255,255,255,.50));
    }
    .hero-inner{width:min(calc(100% - 40px),var(--max));margin:auto;padding:145px 0 75px}
    .eyebrow{
      color:var(--gold-soft);font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:.22em;margin-bottom:18px;
    }
    .hero h1{
      font-family:"Space Grotesk",sans-serif;font-size:clamp(54px,10vw,118px);
      line-height:.88;letter-spacing:-.075em;max-width:900px;
    }
    .hero h1 span{color:#555551;font-weight:400}
    .hero-sub{
      max-width:560px;color:#777772;font-size:14px;line-height:1.75;margin-top:25px;
    }
    .hero-meta{
      display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;
    }
    .meta-pill{
      border:1px solid rgba(20,20,20,.15);background:rgba(0,0,0,.3);
      padding:8px 12px;border-radius:999px;color:#555551;font-size:10px;
      text-transform:uppercase;letter-spacing:.12em;backdrop-filter:blur(10px);
    }
    .hero-bottom{
      position:absolute;left:0;right:0;bottom:0;border-top:1px solid rgba(20,20,20,.09);
      background:rgba(255,255,255,.52);padding:13px 0;
    }
    .hero-bottom .container{
      display:flex;justify-content:space-between;gap:20px;
      color:#777772;font-size:10px;text-transform:uppercase;letter-spacing:.15em;
    }

    /* GENERAL */
    .section{padding:105px 0}
    .section.alt{background:var(--bg-soft);border-block:1px solid rgba(20,20,20,.05)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:45px}
    .kicker{
      color:var(--gold);font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px;
    }
    .title{
      font-family:"Space Grotesk",sans-serif;font-size:clamp(36px,5vw,64px);
      line-height:1;letter-spacing:-.06em;font-weight:600;
    }
    .desc{max-width:430px;color:var(--muted);font-size:13px;line-height:1.75}

    /* BIO */
    .bio{
      display:grid;grid-template-columns:310px 1fr;gap:65px;align-items:start;
    }
    .bio-photo{
      aspect-ratio:1;border-radius:20px;overflow:hidden;border:1px solid var(--line);
      background:#ffffff;
    }
    .bio-photo img{width:100%;height:100%;object-fit:cover}
    .bio-copy h3{
      font-family:"Space Grotesk";font-size:28px;letter-spacing:-.04em;margin-bottom:18px
    }
    .bio-copy p{color:var(--muted);font-size:13px;line-height:1.9;margin-bottom:17px}
    .bio-copy strong{color:#eee;font-weight:600}
    .bio-copy em{color:#ddd}

    /* METRICS */
    .metric-group + .metric-group{margin-top:50px}
    .metric-label{
      color:var(--gold);font-size:10px;text-transform:uppercase;
      letter-spacing:.2em;font-weight:700;margin-bottom:14px;
    }
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .metric{
      border:1px solid var(--line);border-radius:20px;background:var(--surface);
      padding:27px 20px;min-height:145px;display:flex;flex-direction:column;
      justify-content:space-between;transition:.3s var(--ease);
    }
    .metric:hover{transform:translateY(-3px);border-color:var(--line-strong)}
    .metric-number{
      font-family:"Space Grotesk";font-size:34px;font-weight:600;
      letter-spacing:-.05em;color:#171717
    }
    .metric-name{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#777772}
    .metric-platform{font-size:10px;color:var(--gold);margin-top:4px}

    /* DISCOGRAPHY */
    .release-list{display:grid;gap:12px}
    .release{
      display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:20px;
      padding:13px;border:1px solid var(--line);border-radius:20px;
      background:var(--surface);transition:.3s var(--ease);
    }
    .release:hover{border-color:var(--line-strong);transform:translateX(4px)}
    .cover{
      width:86px;height:86px;border-radius:12px;overflow:hidden;background:#1a1a1a
    }
    .cover img{width:100%;height:100%;object-fit:cover}
    .release-info h3{font-family:"Space Grotesk";font-size:18px;letter-spacing:-.025em}
    .release-info p{font-size:11px;color:#777772;margin-top:5px}
    .release-stat{text-align:right}
    .release-stat strong{display:block;font-family:"Space Grotesk";font-size:17px;color:var(--gold)}
    .release-stat span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#666}
    .release-link{
      display:inline-block;margin-top:7px;color:#555551;font-size:10px;
      border-bottom:1px solid #555;padding-bottom:2px;
    }
    .release-link:hover{color:var(--gold);border-color:var(--gold)}

    /* PRESS */
    .quote{
      border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
      padding:55px 60px;position:relative;overflow:hidden;
    }
    .quote:before{
      content:"“";position:absolute;left:30px;top:10px;
      font-family:Georgia,serif;font-size:120px;line-height:1;color:var(--gold);
      opacity:.11;
    }
    .quote p{
      position:relative;font-family:"Space Grotesk";font-size:clamp(22px,3vw,34px);
      line-height:1.3;letter-spacing:-.035em;max-width:900px;
    }
    .quote-source{margin-top:27px;color:#777772;font-size:11px}
    .quote-source a{color:var(--gold)}
    .quote-source a:hover{text-decoration:underline}

    /* RIDER */
    .rider{
      border:1px solid var(--line);border-radius:var(--radius);
      background:var(--surface);padding:45px;
    }
    .rider-head{display:flex;justify-content:space-between;align-items:start;gap:30px}
    .rider h3{font-family:"Space Grotesk";font-size:30px;letter-spacing:-.04em}
    .rider-head p{max-width:480px;color:var(--muted);font-size:13px;line-height:1.8}
    .rider-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:32px 0}
    .rider-item{
      border:1px solid var(--line);border-radius:13px;padding:16px;
      color:#777772;font-size:11px;background:#f4f4f1;
    }
    .rider-item b{display:block;color:var(--gold);font-family:"Space Grotesk";font-size:11px;margin-bottom:7px}
    .rider-note{
      padding:18px;border:1px dashed rgba(216,182,91,.45);border-radius:15px;
      background:rgba(216,182,91,.045);color:#777772;font-size:11px;line-height:1.8;
    }
    .rider-note strong{color:#ddd}
    .rider-action{margin-top:25px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:46px;padding:0 19px;border-radius:999px;
      border:1px solid var(--line-strong);font-size:11px;font-weight:600;
      transition:.3s var(--ease);
    }
    .btn-primary{background:var(--gold);border-color:var(--gold);color:#111111}
    .btn-primary:hover{background:var(--gold-soft);transform:translateY(-2px)}

    /* CONTACT */
    .contacts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .contact{
      border:1px solid var(--line);border-radius:20px;background:var(--surface);
      padding:28px 20px;text-align:center;transition:.3s var(--ease)
    }
    .contact:hover{transform:translateY(-3px);border-color:var(--line-strong)}
    .contact-icon{height:38px;margin-bottom:15px;color:var(--gold);font-size:24px}
    .contact h3{font-family:"Space Grotesk";font-size:16px}
    .contact p{color:#777772;font-size:11px;line-height:1.6;margin:7px 0 17px}
    .contact a{
      display:inline-block;color:#bbb;font-size:10px;border-bottom:1px solid #444;padding-bottom:3px
    }
    .contact a:hover{color:var(--gold);border-color:var(--gold)}

    /* FOOTER */
    footer{border-top:1px solid var(--line);padding:35px 0;background:#ffffff}
    .footer-inner{
      display:flex;justify-content:space-between;align-items:center;gap:20px;
      color:#898983;font-size:10px
    }
    .footer-inner a{color:var(--gold)}
    .footer-inner a:hover{text-decoration:underline}

    /* REVEAL */
    .reveal{opacity:0;transform:translateY(25px);transition:opacity .75s var(--ease),transform .75s var(--ease)}
    .reveal.visible{opacity:1;transform:none}

    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{transition-duration:.01ms!important}
      .reveal{opacity:1;transform:none}
    }

    @media(max-width:800px){
      .nav-links{
        position:fixed;top:64px;left:12px;right:12px;display:none;
        flex-direction:column;gap:0;padding:8px;border:1px solid var(--line);
        border-radius:20px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px)
      }
      .nav-links.open{display:flex}
      .nav-links a{display:block;padding:14px;border-radius:12px}
      .nav-links a::after{display:none}
      .home-link{border:0;padding:14px!important}
      .menu{display:block}
      .hero{min-height:82svh}
      .hero-inner{padding:125px 0 70px}
      .hero-bottom .container{display:block}
      .hero-bottom .container span+span{display:none}
      .section{padding:82px 0}
      .section-head{display:block}
      .desc{margin-top:18px}
      .bio{grid-template-columns:1fr;gap:35px}
      .bio-photo{max-width:310px}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .release{grid-template-columns:70px 1fr}
      .cover{width:70px;height:70px}
      .release-stat{grid-column:2;text-align:left;padding-top:8px;border-top:1px solid var(--line)}
      .rider{padding:28px 20px}
      .rider-head{display:block}
      .rider-head p{margin-top:14px}
      .rider-grid{grid-template-columns:repeat(2,1fr)}
      .contacts{grid-template-columns:repeat(2,1fr)}
      .quote{padding:40px 25px}
      .quote:before{left:14px}
      .footer-inner{display:block}
      .footer-inner p+p{margin-top:8px}
    }

    @media(max-width:480px){
      .container,.nav-inner{width:min(calc(100% - 30px),var(--max))}
      .hero h1{font-size:clamp(48px,16vw,82px)}
      .hero-meta{gap:6px}
      .meta-pill{font-size:8px}
      .metrics{gap:8px}
      .metric{min-height:125px;padding:19px 14px}
      .metric-number{font-size:27px}
      .release-info h3{font-size:15px}
      .release-stat strong{font-size:15px}
      .rider-grid,.contacts{grid-template-columns:1fr}
    }
  
    /* LIGHT THEME */
    body{background:#f7f7f4;color:#171717}
    .site-nav.scrolled,.nav.scrolled{
      background:rgba(255,255,255,.82)!important;
      border-color:rgba(20,20,20,.10)!important;
    }
    .nav-links a{color:#666}
    .nav-links a:hover{color:#111}
    .menu-toggle,.menu{background:rgba(255,255,255,.78);border-color:rgba(20,20,20,.12)}
    .menu-toggle span,.menu-toggle span::before,.menu-toggle span::after,
    .menu span,.menu span::before,.menu span::after{background:#171717}
    .menu-toggle.active span,.menu.active span{background:transparent}
    .nav-cta,.home-link,.secondary,.btn-ghost{
      background:rgba(255,255,255,.72);
      color:#444!important;
      border-color:rgba(20,20,20,.16);
    }
    .nav-cta:hover,.home-link:hover,.secondary:hover,.btn-ghost:hover{
      border-color:#d8b65b;color:#9b7a25!important;
    }
    .hero::before{
      background:
        radial-gradient(circle at 50% 42%,rgba(216,182,91,.13),transparent 32%),
        linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.38) 48%,#f7f7f4 100%)!important;
    }
    .hero::after{
      background:linear-gradient(90deg,rgba(255,255,255,.36),transparent 48%,rgba(255,255,255,.30))!important;
    }
    .hero h1{
      background:linear-gradient(180deg,#151515 10%,#666 100%)!important;
      -webkit-background-clip:text!important;background-clip:text!important;
      color:transparent!important;
    }
    .hero-release{color:#333!important}
    .section.alt{background:#f0f0ed;border-color:rgba(20,20,20,.06)!important}
    .release-feature,.mini-release,.spotify-frame,.tour-shell,.metric,.release,.quote,.rider,.contact,.about-block{
      background:#fff!important;
      border-color:rgba(20,20,20,.10)!important;
    }
    .release-content p,.section-desc,.about-block p,.bio-copy p,.desc{color:#666!important}
    .release-meta,.mini-content p{color:#777!important}
    .release-secondary{color:#555!important;border-color:rgba(20,20,20,.12)!important}
    .release-secondary:hover{color:#9b7a25!important;border-color:#d8b65b!important}
    .contact{background:#fff!important}
    .contact a,.footer-col a{color:#666}
    footer{background:#fff!important;border-color:rgba(20,20,20,.10)!important}
    .footer-brand p,.footer-bottom,.footer-col h4{color:#888!important}
    .footer-col a:hover{color:#9b7a25!important}
    .socials a{color:#666;border-color:rgba(20,20,20,.12)}
    .socials a:hover{color:#9b7a25;border-color:#d8b65b}
    .newsletter input{background:#fff!important;color:#171717!important;border-color:rgba(20,20,20,.14)!important}
    .newsletter input::placeholder{color:#999}
    .contact{
      background:
        radial-gradient(circle at 50% 0,rgba(216,182,91,.13),transparent 34%),
        #f0f0ed!important;
    }

    /* EPK light */
    .bio-photo,.cover{background:#eee!important}
    .metric-number,.release-info h3,.rider h3,.contact h3,.bio-copy h3{color:#171717!important}
    .metric-name,.release-info p,.release-stat span,.rider-item,.contact p{color:#777!important}
    .rider-item{background:#f7f7f4!important;border-color:rgba(20,20,20,.08)!important}
    .rider-note{background:rgba(216,182,91,.08)!important;color:#666!important}
    .quote{background:#fff!important}
    .quote p{color:#222!important}
    .quote-source{color:#777!important}
    .hero h1 span{color:#777!important}

    /* Campaign light */
    .backdrop::after{
      background:
        radial-gradient(circle at 50% 35%,rgba(216,182,91,.10),transparent 30%),
        linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.86) 68%,#f7f7f4 100%)!important;
    }
    .backdrop{opacity:.24!important}
    .grain{opacity:.025!important}
    .art{border-color:rgba(20,20,20,.12)!important}
    .art-label{color:#111!important}
    .subtitle{color:#666!important}
    .release-line{color:#777!important}
    .countdown{border-color:rgba(20,20,20,.10)!important;background:rgba(20,20,20,.10)!important}
    .count-item{background:rgba(255,255,255,.82)!important}
    .unit{color:#777!important}
    .fineprint{color:#888!important}
    footer p{color:#888!important}
    .era,.home{background:rgba(255,255,255,.68)!important;color:#666!important;border-color:rgba(20,20,20,.12)!important}
    
  </style>
</head>

<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="/">HAFYZ</a>
      <nav aria-label="Press kit navigation">
        <ul class="nav-links" id="nav-links">
          <li><a href="#bio">Artist</a></li>
          <li><a href="#stats">Metrics</a></li>
          <li><a href="#discography">Releases</a></li>
          <li><a href="#press">Press</a></li>
          <li><a href="#rider">Rider</a></li>
          <li><a href="#contact">Booking</a></li>
          <li><a class="home-link" href="/">Back to website</a></li>
        </ul>
      </nav>
      <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false"><span></span></button>
    </d
