  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #faf8f5;
      --text: #1a1a2e;
      --text-light: #666;
      --accent: #c9a96e;
      --accent-dark: #a88b4a;
      --border: rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(250,248,245,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.3em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-home {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-light);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .nav-home:hover {
      color: var(--accent);
    }

    /* ===== MAIN CONTENT ===== */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8rem 2rem 4rem;
      text-align: center;
    }

    .release-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease 0.2s both;
    }

    .release-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      animation: fadeInUp 1s ease 0.4s both;
    }

    .release-title span {
      font-style: italic;
      color: var(--accent-dark);
    }

    .cover-art {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      border-radius: 12px;
      margin: 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      box-shadow: 0 20px 60px rgba(201,169,110,0.3);
      animation: fadeInUp 1s ease 0.6s both;
    }

    .cover-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .release-meta {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease 0.8s both;
    }

    /* ===== STREAMING LINKS ===== */
    .streaming-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease 1s both;
    }

    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ===== FOOTER ===== */
    footer {
      width: 100%;
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    footer p {
      font-size: 0.8rem;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    footer a {
      color: var(--accent-dark);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: var(--text);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      nav {
        padding: 1rem 1.5rem;
      }

      .cover-art {
        width: 250px;
        height: 250px;
      }

      .streaming-links {
        flex-direction: column;
        align-items: center;
      }

      .listen-btn {
        width: 100%;
        max-width: 280px;
        justify-content: center;
      }
    }
  </style>
<base target="_blank">
</head>
