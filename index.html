<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAFYZ | Official Website</title>
  <meta name="description" content="Official website of HAFYZ. Music, releases, tour dates and more.">
  <meta name="theme-color" content="#f7f7f4">

  <meta property="og:title" content="HAFYZ | Official Website">
  <meta property="og:description" content="Music, releases, tour dates and more from HAFYZ.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hafyz.my.id/">
  <meta property="og:image" content="https://hafyz.my.id/hero-bg.jpg">

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f7f7f4;
      --white:#fff;
      --ink:#171717;
      --ink-soft:#343431;
      --muted:#6f6f6a;
      --muted-2:#92928c;
      --line:rgba(20,20,20,.11);
      --gold:#c69e3e;
      --gold-dark:#9b7821;
      --gold-pale:#f2e7c8;
      --max:1160px;
      --radius:24px;
      --ease:cubic-bezier(.2,.75,.25,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:84px}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    button{font:inherit}
    ::selection{background:var(--gold);color:#fff}
    :focus-visible{outline:2px solid var(--gold);outline-offset:4px}

    .wrap{width:min(calc(100% - 40px),var(--max));margin:auto}

    /* NAV */
    .nav{
      position:fixed;
      inset:0 0 auto;
      z-index:1000;
      height:72px;
      border-bottom:1px solid transparent;
      transition:.3s var(--ease);
    }
    .nav.scrolled{
      background:rgba(255,255,255,.86);
      border-color:var(--line);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 8px 30px rgba(0,0,0,.04);
    }
    .nav-inner{
      height:100%;
      width:min(calc(100% - 40px),var(--max));
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      font-family:"Space Grotesk",sans-serif;
      font-size:18px;
      font-weight:700;
      letter-spacing:.25em;
    }
    .brand:hover{color:var(--gold-dark)}
    .nav-links{
      display:flex;
      align-items:center;
      gap:28px;
      list-style:none;
      margin:0;
      padding:0;
    }
    .nav-links a{
      position:relative;
      color:#666661;
      font-size:12px;
      font-weight:600;
      transition:.25s;
    }
    .nav-links a:hover{color:var(--ink)}
    .nav-links a:not(.nav-cta)::after{
      content:"";
      position:absolute;
      left:0;
      right:100%;
      bottom:-7px;
      height:1px;
      background:var(--gold);
      transition:.25s var(--ease);
    }
    .nav-links a:not(.nav-cta):hover::after{right:0}
    .nav-cta{
      padding:10px 16px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.5);
    }
    .nav-cta:hover{
      color:var(--gold-dark)!important;
      border-color:rgba(198,158,62,.55);
    }
    .menu{
      display:none;
      width:42px;height:42px;
      border:1px solid var(--line);
      border-radius:50%;
      background:rgba(255,255,255,.75);
      cursor:pointer;
    }
    .menu span,.menu span:before,.menu span:after{
      display:block;
      width:17px;height:1.5px;
      background:var(--ink);
      margin:auto;
      position:relative;
      transition:.25s;
    }
    .menu span:before,.menu span:after{
      content:"";
      position:absolute;
      left:0;
    }
    .menu span:before{top:-6px}
    .menu span:after{top:6px}
    .menu.active span{background:transparent}
    .menu.active span:before{top:0;transform:rotate(45deg)}
    .menu.active span:after{top:0;transform:rotate(-45deg)}

    /* HERO */
    .hero{
      min-height:100svh;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      isolation:isolate;
      background:
        linear-gradient(180deg,rgba(255,255,255,.04),rgba(247,247,244,.86) 80%,var(--bg)),
        url("/hero-bg.jpg") center/cover no-repeat;
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(circle at 50% 38%,rgba(198,158,62,.11),transparent 32%),
        linear-gradient(90deg,rgba(255,255,255,.58),rgba(255,255,255,.18) 50%,rgba(255,255,255,.48));
    }
    .hero-content{
      width:min(calc(100% - 40px),900px);
      margin:auto;
      text-align:center;
      padding:92px 0 80px;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:var(--gold-dark);
      font-size:10px;
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
      margin-bottom:20px;
    }
    .eyebrow:before{
      content:"";
      width:27px;height:1px;
      background:currentColor;
    }
    .hero-release{
      margin:0 0 10px;
      color:var(--ink-soft);
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(18px,3vw,29px);
      letter-spacing:-.03em;
    }
    .hero h1{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(82px,16vw,185px);
      line-height:.78;
      letter-spacing:-.09em;
      color:var(--ink);
    }
    .hero-actions{
      margin-top:32px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
    }
    .btn{
      min-height:48px;
      padding:0 21px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      transition:.3s var(--ease);
    }
    .btn-primary{
      background:var(--gold);
      border:1px solid var(--gold);
      color:#fff;
      box-shadow:0 12px 30px rgba(198,158,62,.18);
    }
    .btn-primary:hover{background:var(--gold-dark);transform:translateY(-2px)}
    .btn-secondary{
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      color:#444;
    }
    .btn-secondary:hover{border-color:rgba(20,20,20,.25);transform:translateY(-2px)}

    /* SECTIONS */
    .section{padding:110px 0}
    .section.alt{
      background:#efefec;
      border-block:1px solid rgba(20,20,20,.05);
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:30px;
      margin-bottom:44px;
    }
    .kicker{
      margin:0 0 11px;
      color:var(--gold-dark);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.2em;
    }
    .title{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(38px,6vw,70px);
      line-height:.98;
      letter-spacing:-.065em;
    }
    .desc{
      max-width:430px;
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.75;
    }

    /* RELEASE */
    .release-feature{
      display:grid;
      grid-template-columns:1.06fr .94fr;
      min-height:535px;
      background:var(--white);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 18px 55px rgba(0,0,0,.045);
    }
    .release-art{
      position:relative;
      min-height:535px;
      overflow:hidden;
      background:#e9e9e5;
    }
    .release-art img{
      width:100%;height:100%;
      object-fit:cover;
      transition:transform .8s var(--ease);
    }
    .release-feature:hover .release-art img{transform:scale(1.025)}
    .release-badge{
      position:absolute;
      top:20px;left:20px;
      z-index:2;
      padding:8px 12px;
      border:1px solid rgba(20,20,20,.12);
      border-radius:999px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(12px);
      color:#555;
      font-size:9px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .release-content{
      padding:55px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .release-number{
      margin:0 0 16px;
      color:var(--gold-dark);
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .release-content h3{
      margin:0 0 13px;
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(30px,4vw,51px);
      line-height:1.02;
      letter-spacing:-.055em;
    }
    .release-meta{
      margin:0 0 23px;
      color:#888;
      font-size:12px;
    }
    .release-content > p:not(.release-number):not(.release-meta){
      margin:0;
      max-width:450px;
      color:#666;
      font-size:13px;
      line-height:1.85;
    }
    .release-actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:28px;
    }
    .release-secondary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:45px;
      padding:0 16px;
      border:1px solid var(--line);
      border-radius:999px;
      color:#555;
      font-size:10px;
      font-weight:700;
      transition:.25s;
    }
    .release-secondary:hover{border-color:var(--gold);color:var(--gold-dark)}

    /* STRIPPED PROMO */
    .stripped-promo{
      display:flex;
      align-items:center;
      gap:13px;
      width:min(100%,500px);
      margin-top:18px;
      padding:10px;
      border:1px solid rgba(198,158,62,.34);
      border-radius:18px;
      background:linear-gradient(110deg,#fffdf6,#fff);
      box-shadow:0 12px 34px rgba(198,158,62,.10);
      transition:.35s var(--ease);
    }
    .stripped-promo:hover{
      transform:translateY(-3px);
      border-color:rgba(198,158,62,.75);
      box-shadow:0 17px 45px rgba(198,158,62,.15);
    }
    .stripped-promo-art{
      flex:0 0 62px;
      width:62px;height:62px;
      overflow:hidden;
      border-radius:11px;
      background:#eee;
    }
    .stripped-promo-art img{
      width:100%;height:100%;
      object-fit:cover;
    }
    .stripped-promo-copy{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .stripped-promo-kicker{
      color:var(--gold-dark);
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.17em;
    }
    .stripped-promo-copy strong{
      color:var(--ink);
      font-family:"Space Grotesk",sans-serif;
      font-size:13px;
      line-height:1.25;
      letter-spacing:-.02em;
    }
    .stripped-promo-link{
      color:var(--gold-dark);
      font-size:10px;
      font-weight:800;
      margin-top:3px;
    }
    .stripped-promo-link span{
      display:inline-block;
      transition:.25s;
    }
    .stripped-promo:hover .stripped-promo-link span{transform:translateX(4px)}

    .release-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
      margin-top:16px;
    }
    .mini-release{
      display:grid;
      grid-template-columns:150px 1fr;
      overflow:hidden;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      transition:.3s var(--ease);
    }
    .mini-release:hover{transform:translateY(-3px);border-color:rgba(20,20,20,.2)}
    .mini-release > img{
      width:150px;height:150px;
      object-fit:cover;
    }
    .mini-content{
      padding:21px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .mini-content h4{
      margin:0 0 7px;
      font-family:"Space Grotesk",sans-serif;
      font-size:19px;
      line-height:1.1;
    }
    .mini-content p{
      margin:0 0 13px;
      color:#888;
      font-size:11px;
    }
    .text-link{
      color:var(--gold-dark);
      font-size:10px;
      font-weight:800;
    }
    .text-link span{display:inline-block;transition:.25s}
    .text-link:hover span{transform:translateX(4px)}

    /* TOUR */
    .tour-shell{
      padding:7px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 18px 55px rgba(0,0,0,.04);
    }
    #seated-55fdf2c0{width:100%;min-height:400px}

    /* ABOUT */
    .about-layout{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:85px;
    }
    .about-lead{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(27px,4vw,46px);
      line-height:1.18;
      letter-spacing:-.045em;
    }
    .about-lead strong{color:var(--ink)}
    .about-side{display:grid;gap:25px}
    .about-block{
      padding-top:20px;
      border-top:1px solid var(--line);
    }
    .about-block h3{
      margin:0 0 8px;
      color:var(--gold-dark);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.16em;
    }
    .about-block p{
      margin:0;
      color:#6d6d68;
      font-size:12px;
      line-height:1.85;
    }

    /* SPOTIFY */
    .spotify-frame{
      padding:7px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
    }
    .spotify-frame iframe{
      display:block;
      width:100%;
      height:390px;
      border:0;
      border-radius:19px;
    }

    /* CONTACT */
    .contact{
      padding:125px 0;
      text-align:center;
      background:
        radial-gradient(circle at 50% 0,rgba(198,158,62,.12),transparent 35%),
        #efefec;
      border-top:1px solid rgba(20,20,20,.06);
    }
    .contact h2{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      font-size:clamp(44px,7vw,85px);
      line-height:.95;
      letter-spacing:-.07em;
    }
    .contact > .wrap > p:not(.kicker){
      max-width:470px;
      margin:20px auto 28px;
      color:#70706b;
      font-size:13px;
    }
    .newsletter{
      width:min(100%,500px);
      margin:auto;
      display:flex;
      gap:8px;
    }
    .newsletter input{
      flex:1;
      min-width:0;
      height:49px;
      padding:0 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--ink);
      outline:none;
      font-size:12px;
    }
    .newsletter input:focus{border-color:var(--gold)}
    .newsletter input::placeholder{color:#aaa}

    /* FOOTER */
    footer{
      background:#fff;
      border-top:1px solid var(--line);
      padding:50px 0 23px;
    }
    .footer-top{
      display:flex;
      justify-content:space-between;
      gap:50px;
      padding-bottom:42px;
    }
    .footer-brand{max-width:330px}
    .footer-brand .brand{display:inline-block;margin-bottom:15px}
    .footer-brand p{
      margin:0;
      color:#888;
      font-size:11px;
      line-height:1.8;
    }
    .footer-columns{display:flex;gap:70px}
    .footer-col h4{
      margin:0 0 13px;
      color:#999;
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.18em;
    }
    .footer-col a{
      display:block;
      margin-bottom:9px;
      color:#666;
      font-size:11px;
    }
    .footer-col a:hover{color:var(--gold-dark)}
    .socials{display:flex;gap:8px;margin-top:17px}
    .socials a{
      width:35px;height:35px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:50%;
      color:#777;
      transition:.25s;
    }
    .socials a:hover{color:var(--gold-dark);border-color:var(--gold)}
    .footer-bottom{
      padding-top:19px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:20px;
      color:#999;
      font-size:9px;
    }

    /* REVEAL */
    .reveal{
      opacity:0;
      transform:translateY(24px);
      transition:opacity .7s var(--ease),transform .7s var(--ease);
    }
    .reveal.visible{opacity:1;transform:none}

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{transition-duration:.01ms!important}
      .reveal{opacity:1;transform:none}
    }

    /* MOBILE */
    @media(max-width:820px){
      .nav-links{
        position:fixed;
        top:64px;
        left:12px;
        right:12px;
        display:none;
        flex-direction:column;
        gap:0;
        padding:8px;
        background:rgba(255,255,255,.97);
        border:1px solid var(--line);
        border-radius:20px;
        box-shadow:0 20px 55px rgba(0,0,0,.10);
        backdrop-filter:blur(18px);
      }
      .nav-links.open{display:flex}
      .nav-links li{width:100%}
      .nav-links a{
        display:block;
        padding:14px;
        border-radius:12px;
      }
      .nav-links a:hover{background:#f1f1ee}
      .nav-links a:not(.nav-cta)::after{display:none}
      .nav-cta{border:0;background:transparent;padding:14px!important}
      .menu{display:block}
      .section{padding:82px 0}
      .section-head{display:block;margin-bottom:35px}
      .desc{margin-top:16px}
      .release-feature{grid-template-columns:1fr;min-height:0}
      .release-art{min-height:0;aspect-ratio:1/1}
      .release-content{padding:34px 24px 30px}
      .release-grid{grid-template-columns:1fr}
      .about-layout{grid-template-columns:1fr;gap:45px}
      .newsletter{flex-direction:column}
      .newsletter input,.newsletter .btn{width:100%}
      .footer-top{display:block}
      .footer-columns{margin-top:35px;gap:45px;flex-wrap:wrap}
      .footer-bottom{display:block}
      .footer-bottom p+p{margin-top:7px}
    }

    @media(max-width:480px){
      .wrap,.nav-inner{width:min(calc(100% - 30px),var(--max))}
      .hero-content{width:min(calc(100% - 30px),900px)}
      .hero h1{font-size:clamp(76px,24vw,130px)}
      .hero-actions .btn{width:100%}
      .release-content h3{font-size:32px}
      .mini-release{grid-template-columns:120px 1fr}
      .mini-release > img{width:120px;height:120px}
      .mini-content{padding:16px}
      .mini-content h4{font-size:16px}
      .stripped-promo{width:100%}
      .stripped-promo-copy strong{font-size:12px}
    }
  </style>
</head>

<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="HAFYZ home">HAFYZ</a>

      <nav aria-label="Main navigation">
        <ul class="nav-links" id="navLinks">
          <li><a href="#music">Music</a></li>
          <li><a href="#tour">Tour</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="/press/">Press</a></li>
          <li><a class="nav-cta" href="#contact">Contact</a></li>
        </ul>
      </nav>

      <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false">
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="HAFYZ latest release">
      <div class="hero-content">
        <p class="eyebrow">New release</p>
        <p class="hero-release">chasing hollow gold (After Hours)</p>
        <h1>HAFYZ</h1>

        <div class="hero-actions">
          <a class="btn btn-primary" href="#music">Listen now ↗</a>
          <a class="btn btn-secondary" href="#tour">View tour dates</a>
        </div>
      </div>
    </section>

    <section class="section" id="music">
      <div class="wrap">
        <div class="section-head reveal">
          <div>
            <p class="kicker">Music</p>
            <h2 class="title">Latest releases.</h2>
          </div>
          <p class="desc">The current chapter of HAFYZ, i
